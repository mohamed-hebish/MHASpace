<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MHASpace Game</title>
  
  <!-- مكتبة تليجرام الرسمية للتطبيقات المصغرة (ضروري جداً) -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #0f172a;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .promo-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      max-width: 350px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .btn-stars {
      background: linear-gradient(135deg, #ffaa00, #ff7700);
      color: #000;
      font-weight: bold;
      font-size: 16px;
      border: none;
      padding: 14px 24px;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      margin-top: 15px;
      box-shadow: 0 4px 15px rgba(255, 170, 0, 0.3);
      transition: transform 0.2s;
    }

    .btn-stars:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="promo-card">
    <h2>🚀 ترويج الحساب / مضاعفة المكافأة</h2>
    <p>ضاعف مكافآتك واستفد من السرعة القصوى داخل اللعبة باستخدام نجوم تليجرام!</p>
    
    <!-- زر الدفع بالنجوم -->
    <button class="btn-stars" id="payStarsBtn" onclick="buyWithStars()">
      شراء الميزة (50 ⭐)
    </button>
  </div>

  <!-- ربط ملف المنطق البرمجي -->
  <script src="app.js"></script>
</body>
</html>
