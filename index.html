<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MHASpace</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #080b10; font-family: system-ui, sans-serif; color: #fff; }
    #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
    
    .hud {
      position: absolute; top: 12px; left: 12px; right: 12px;
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px);
      border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 16px;
      padding: 12px 16px; z-index: 10;
    }
    .badge { font-size: 12px; padding: 4px 10px; border-radius: 20px; background: #1e293b; color: #38bdf8; border: 1px solid #38bdf8; font-weight: bold; }
    .stats { text-align: left; dir: ltr; }
    .stats .val { font-size: 18px; font-weight: bold; color: #38bdf8; }

    .cap-banner {
      position: absolute; top: 80px; left: 50%; transform: translateX(-50%);
      background: rgba(234, 179, 8, 0.2); border: 1px solid #eab308; color: #fef08a;
      padding: 6px 14px; border-radius: 20px; font-size: 11px; text-align: center; z-index: 10; width: 90%; max-width: 380px;
    }

    .action-bar {
      position: absolute; bottom: 30px; left: 0; right: 0;
      display: flex; flex-direction: column; align-items: center; gap: 14px; z-index: 10;
    }
    .pay-group { display: flex; gap: 10px; }
    .btn-pay {
      background: linear-gradient(135deg, #0284c7, #0369a1); border: none; color: white;
      padding: 12px 16px; border-radius: 12px; font-size: 13px; font-weight: bold;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4); cursor: pointer; touch-action: manipulation;
    }

    .dpad { display: grid; grid-template-columns: repeat(3, 50px); grid-gap: 8px; }
    .dbtn {
      width: 50px; height: 50px; background: rgba(255,255,255,0.15); backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.3); border-radius: 12px; color: white; font-size: 20px;
      display: flex; align-items: center; justify-content: center; cursor: pointer; touch-action: manipulation;
    }
    .dbtn:active { background: rgba(56, 189, 248, 0.5); }
  </style>
</head>
<body>

  <div class="hud">
    <div>
      <span class="badge" id="rank-badge">برونزي (1x)</span>
      <div style="font-size: 11px; margin-top: 4px; color: #4ade80;">متصل بالسيرفر ✅</div>
    </div>
    <div class="stats">
      <div style="font-size: 10px; color: #94a3b8; text-align: right;">رصيد MHA النقاط</div>
      <div class="val"><span id="score-val">0</span> / 750,000,000</div>
    </div>
  </div>

  <div class="cap-banner">
    ⚠️ الحد الأقصى للتجميع المباشر: 750,000,000 MHA قبل الترحيل لـ EVM
  </div>

  <div class="action-bar">
    <div class="pay-group">
      <button class="btn-pay" onclick="boost(10, '0.10')">تفعيل 10x (0.10 TON)</button>
      <button class="btn-pay" onclick="boost(20, '0.20')">تفعيل 20x (0.20 TON)</button>
    </div>
    
    <div class="dpad">
      <div></div><div class="dbtn" id="btn-up">▲</div><div></div>
      <div class="dbtn" id="btn-left">◄</div><div></div><div class="dbtn" id="btn-right">►</div>
      <div></div><div class="dbtn" id="btn-down">▼</div><div></div>
    </div>
  </div>

  <div id="canvas-container"></div>

  <script>
    let score = 0;
    let multiplier = 1;
    const maxCap = 750000000;
    const DEST_WALLET = "UQAqK_qhqpc_lMlh2SVmaqjbR4XfmkIhPdPVoUukb1aYHTG9";

    // Three.js Render Setup
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x080b10);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // Lights
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);
    const pointLight = new THREE.PointLight(0x38bdf8, 2, 50);
    pointLight.position.set(0, 10, 10);
    scene.add(pointLight);

    // Grid Floor
    const grid = new THREE.GridHelper(60, 40, 0x38bdf8, 0x1e293b);
    grid.position.y = -0.5;
    scene.add(grid);

    // Player Mesh
    const pGeo = new THREE.CylinderGeometry(0.5, 0.5, 1.2, 16);
    const pMat = new THREE.MeshStandardMaterial({ color: 0x0284c7, metalness: 0.8, roughness: 0.2 });
    const player = new THREE.Mesh(pGeo, pMat);
    player.position.y = 0.1;
    scene.add(player);

    // Crystal Mesh
    const cGeo = new THREE.OctahedronGeometry(0.7);
    const cMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, emissive: 0x0284c7, roughness: 0.1 });
    const crystal = new THREE.Mesh(cGeo, cMat);
    crystal.position.set(0, 0.5, -6);
    scene.add(crystal);

    camera.position.set(0, 5, 8);
    camera.lookAt(player.position);

    // Controls Logic
    function movePlayer(dx, dz) {
      player.position.x += dx;
      player.position.z += dz;
      camera.position.x = player.position.x;
      camera.position.z = player.position.z + 8;

      // Collision Detection
      let dist = player.position.distanceTo(crystal.position);
      if(dist < 1.0) {
        collect();
      }
    }

    function collect() {
      if(score >= maxCap) return;
      score += (1 * multiplier);
      document.getElementById('score-val').innerText = score.toLocaleString();
      
      if(score >= 1000000) {
        document.getElementById('rank-badge').innerText = `فضي (${multiplier}x)`;
      }

      // Respawn Crystal
      crystal.position.x = (Math.random() - 0.5) * 14;
      crystal.position.z = (Math.random() - 0.5) * 14;
    }

    function boost(multi, tonAmt) {
      const tonUrl = `https://app.tonkeeper.com/transfer/${DEST_WALLET}?amount=${parseFloat(tonAmt)*1000000000}&text=MHASpaceBoost`;
      window.open(tonUrl, '_blank');
      multiplier = multi;
      document.getElementById('rank-badge').innerText = `ممتاز (${multi}x)`;
    }

    // Touch & Click Event Handlers
    const bindBtn = (id, dx, dz) => {
      const el = document.getElementById(id);
      const handler = (e) => { e.preventDefault(); movePlayer(dx, dz); };
      el.addEventListener('touchstart', handler, {passive: false});
      el.addEventListener('click', handler);
    };

    bindBtn('btn-up', 0, -0.6);
    bindBtn('btn-down', 0, 0.6);
    bindBtn('btn-left', -0.6, 0);
    bindBtn('btn-right', 0.6, 0);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      crystal.rotation.y += 0.03;
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
