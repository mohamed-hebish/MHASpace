<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>MHASpace Mini App</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background: #080b10; color: #fff; font-family: system-ui, sans-serif; overflow: hidden; }
    #canvas-container { width: 100vw; height: 100vh; display: block; }
    
    /* UI Overlay */
    .hud {
      position: absolute; top: 12px; left: 12px; right: 12px;
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px);
      border: 1px solid rgba(56, 189, 248, 0.2); border-radius: 16px;
      padding: 10px 16px; z-index: 10;
    }
    .badge { font-size: 11px; padding: 3px 8px; border-radius: 20px; background: #1e293b; color: #38bdf8; border: 1px solid #38bdf8; }
    .stats { text-align: left; }
    .stats .val { font-size: 18px; font-weight: bold; color: #38bdf8; }
    
    /* Notice Banner */
    .cap-banner {
      position: absolute; top: 75px; left: 50%; transform: translateX(-50%);
      background: rgba(234, 179, 8, 0.15); border: 1px solid #eab308; color: #fef08a;
      padding: 6px 14px; border-radius: 20px; font-size: 11px; text-align: center; z-index: 10;
    }

    /* Controls & Payment Modal */
    .action-bar {
      position: absolute; bottom: 20px; left: 0; right: 0;
      display: flex; flex-direction: column; align-items: center; gap: 12px; z-index: 10;
    }
    .pay-group { display: flex; gap: 8px; }
    .btn-pay {
      background: linear-gradient(135deg, #0284c7, #0369a1); border: none; color: white;
      padding: 10px 14px; border-radius: 12px; font-size: 12px; font-weight: bold;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4); cursor: pointer;
    }
    .btn-pay:active { transform: scale(0.95); }
    
    /* Controller Pad */
    .dpad { display: grid; grid-template-columns: repeat(3, 45px); grid-gap: 5px; }
    .dbtn {
      width: 45px; height: 45px; background: rgba(255,255,255,0.1); backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; color: white; font-size: 16px;
      display: flex; align-items: center; justify-content: center;
    }
  </style>
</head>
<body>

  <div class="hud">
    <div>
      <span class="badge" id="rank-badge">برونزي (1x)</span>
      <div style="font-size: 11px; margin-top: 4px; color: #94a3b8;" id="status-text">متصل بالسيرفر ✅</div>
    </div>
    <div class="stats">
      <div style="font-size: 10px; color: #94a3b8;">رصيد MHA النقاط</div>
      <div class="val" id="mha-score">0 / 750</div>
    </div>
  </div>

  <div class="cap-banner">
    ⚠️ الحد الأقصى للتجميع المباشر: 750 MHA قبل الترحيل لـ EVM
  </div>

  <div class="action-bar">
    <div id="ton-connect-btn"></div>
    <div class="pay-group">
      <button class="btn-pay" onclick="boostSpeed(0.10, 10)">تفعيل 10x (0.10 TON)</button>
      <button class="btn-pay" onclick="boostSpeed(0.20, 20)">تفعيل 20x (0.20 TON)</button>
    </div>
    
    <div class="dpad">
      <div></div><div class="dbtn" onclick="move(0,-0.5)">▲</div><div></div>
      <div class="dbtn" onclick="move(-0.5,0)">◄</div><div></div><div class="dbtn" onclick="move(0.5,0)">►</div>
      <div></div><div class="dbtn" onclick="move(0,0.5)">▼</div><div></div>
    </div>
  </div>

  <div id="canvas-container"></div>

  <script>
    const DESTINATION_WALLET = "UQAqK_qhqpc_lMlh2SVmaqjbR4XfmkIhPdPVoUukb1aYHTG9";
    let score = 0;
    let multiplier = 1;
    const maxCap = 750;

    // Initialize TON Connect
    const tonConnectUI = new TONConnectUI.TonConnectUI({
        manifestUrl: 'https://mohamed-habish-official.pages.dev/tonconnect-manifest.json',
        buttonRootId: 'ton-connect-btn'
    });

    // Three.js Setup
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x080b10, 0.05);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    // Lights
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const light = new THREE.PointLight(0x38bdf8, 2, 50);
    light.position.set(0, 10, 10);
    scene.add(light);

    // Ground Grid
    const grid = new THREE.GridHelper(50, 50, 0x38bdf8, 0x1e293b);
    grid.position.y = -0.5;
    scene.add(grid);

    // Player (Avatar)
    const pGeo = new THREE.CylinderGeometry(0.4, 0.4, 1, 16);
    const pMat = new THREE.MeshStandardMaterial({ color: 0x0284c7, metalness: 0.8, roughness: 0.2 });
    const player = new THREE.Mesh(pGeo, pMat);
    scene.add(player);

    // Crystal Core
    const cGeo = new THREE.OctahedronGeometry(0.6);
    const cMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, wireframe: false, emissive: 0x0284c7 });
    const crystal = new THREE.Mesh(cGeo, cMat);
    crystal.position.set(0, 0.5, -5);
    scene.add(crystal);

    camera.position.set(0, 4, 6);
    camera.lookAt(player.position);

    function move(dx, dz) {
      player.position.x += dx;
      player.position.z += dz;
      camera.position.x = player.position.x;
      camera.position.z = player.position.z + 6;

      // Collision Check
      let dist = player.position.distanceTo(crystal.position);
      if(dist < 0.8) {
        collectCrystal();
      }
    }

    function collectCrystal() {
      if(score >= maxCap) {
        alert("وصلت للحد الأقصى للتجميع المباشر (750 MHA). انتظر ترحيل EVM!");
        return;
      }
      score = Math.min(maxCap, score + (1 * multiplier));
      document.getElementById('mha-score').innerText = `${score} / ${maxCap}`;
      
      // Update Rank Badge
      if(score >= 1000000) {
        document.getElementById('rank-badge').innerText = "فضي (Silver)";
      }

      // Respawn Crystal
      crystal.position.x = (Math.random() - 0.5) * 10;
      crystal.position.z = (Math.random() - 0.5) * 10;
      syncWithServer(score);
    }

    async function boostSpeed(amount, multi) {
      if(!tonConnectUI.connected) {
        alert("يرجى ربط محفظة TON أولاً عبر الزر العلوي!");
        return;
      }
      
      const transaction = {
        validUntil: Math.floor(Date.now() / 1000) + 60,
        messages: [{
          address: DESTINATION_WALLET,
          amount: (amount * 1000000000).toString() // NanoTON
        }]
      };

      try {
        await tonConnectUI.sendTransaction(transaction);
        multiplier = multi;
        document.getElementById('rank-badge').innerText = `ممتاز (${multi}x)`;
        alert(`تم تفعيل المضاعف ${multi}x بنجاح!`);
      } catch (e) {
        alert("تم إلغاء أو فشل المعاملة.");
      }
    }

    function syncWithServer(currentScore) {
      // Cloudflare Worker API call
      fetch('/api/sync', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ score: currentScore, multiplier: multiplier })
      }).catch(() => {});
    }

    function animate() {
      requestAnimationFrame(animate);
      crystal.rotation.y += 0.02;
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
